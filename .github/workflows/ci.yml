# Checks every push to main and every pull request. Each step only runs
# for the languages this repository actually contains.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ---------------------------------------------------------------- Python
      - name: Set up Python
        if: hashFiles('**/*.py') != ''
        uses: actions/setup-python@v7
        with:
          python-version: "3.12" # Change to the version your project uses.

      - name: Install Python dependencies
        if: hashFiles('**/*.py') != ''
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ] && grep -q '^\[project\]' pyproject.toml; then
            pip install -e ".[dev]" || pip install -e .
          fi

      - name: Check that every Python file compiles
        if: hashFiles('**/*.py') != ''
        run: python -m compileall -q .

      - name: Run the Python tests
        if: hashFiles('**/*.py') != ''
        run: |
          if [ -d tests ] || [ -d test ]; then
            pip install pytest
            # Exit code 5 means no tests were found yet, which is not a failure.
            pytest || [ $? -eq 5 ]
          else
            echo "No tests folder yet. Add tests/ and they will run here."
          fi

      # --------------------------------------------------------------- Node.js
      - name: Set up Node.js
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install Node.js dependencies
        if: hashFiles('package.json') != ''
        run: |
          if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then corepack enable && yarn install --immutable
          elif [ -f package-lock.json ]; then npm ci
          else npm install
          fi

      - name: Lint, build and test
        if: hashFiles('package.json') != ''
        run: |
          npm run lint --if-present
          npm run build --if-present
          npm test --if-present
