version: 2
updates:
  # Keeps the actions used by the workflows up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Uncomment the ecosystem your project uses once it has dependencies.
  # - package-ecosystem: pip
